<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1. Carga de datos — Constancia de alumno regular</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>

<body>
  <div class="pagina">
    <div class="cabecera-app">
      <h1 id="inst"></h1>
      <div class="pasos"><span class="activo">1. Datos</span><span>2. Certificado y pago</span><span>3. Impresión</span>
      </div>
    </div>

    <div class="panel form">
      <h2>Datos del alumno</h2>
      <label for="nombre">Nombre</label>
      <input id="nombre" autocomplete="given-name">
      <label for="apellido">Apellido</label>
      <input id="apellido" autocomplete="family-name">
      <label for="dni">DNI</label>
      <input id="dni" inputmode="numeric" maxlength="8" placeholder="Sin puntos">
      <label for="carrera">Carrera</label>
      <select id="carrera">
        <option value="" disabled selected>Seleccione su Carrera</option>
        <option value="Profesorado de Educacion Secundaria en Informatica">Profesorado de Educacion Secundaria en Informatica</option>
        <option value="Profesorado de Ingles">Profesorado de Ingles</option>
        <option value="Profesorado de Matematicas">Profesorado de Matematicas</option>
      </select>
      <label for="fecha">Fecha de entrega del certificado</label>
      <input id="fecha" type="date">
      <div class="err" id="err" role="alert"></div>
      <button class="btn" id="continuar">Ver certificado</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <script src="config.js"></script>
  <script src="comun.js"></script>
  <script>
    const CAMPOS = ["nombre", "apellido", "dni", "carrera", "fecha"];
    let idActual = idURL();

    $("inst").textContent = CONFIG.institucion;
    $("fecha").valueAsDate = new Date();

    // Si el usuario vuelve desde la vista 2, recuperamos lo que ya había guardado
    (async () => {
      try {
        const previo = await cargarConstancia(idActual);
        if (previo) for (const k of CAMPOS) $(k).value = previo[k];
        else idActual = null;
      } catch (e) { idActual = null; }
    })();

    $("continuar").addEventListener("click", async () => {
      const d = {};
      for (const k of CAMPOS) d[k] = $(k).value.trim();
      if (Object.values(d).some(v => !v)) { $("err").textContent = "Completá todos los campos."; return; }
      if (!/^\d{7,8}$/.test(d.dni)) { $("err").textContent = "El DNI debe tener 7 u 8 números, sin puntos."; return; }

      $("err").textContent = "";
      $("continuar").disabled = true;
      try {
        let id = null;
        // Si ya existía un registro sin pagar, se actualiza
        if (idActual) {
          const { data, error } = await db.rpc("actualizar_constancia", {
            p_id: idActual, p_nombre: d.nombre, p_apellido: d.apellido, p_dni: d.dni,
            p_carrera: d.carrera, p_fecha: d.fecha
          });
          if (error) throw error;
          if (data) id = idActual;
        }
        // Si no existía (o ya estaba pagado) se crea uno nuevo
        if (!id) {
          id = nuevoId();
          const { error } = await db.from("constancias").insert({ id, ...d });
          if (error) throw error;
        }
        location.href = "certificado.html?id=" + id;
      } catch (e) {
        console.error(e);
        $("err").textContent = "No se pudo guardar. Revisá tu conexión e intentá de nuevo.";
        $("continuar").disabled = false;
      }
    });
  </script>
</body>

</html>
